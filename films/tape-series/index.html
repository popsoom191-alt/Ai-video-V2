<!doctype html>
<html><head><meta charset="utf-8"><title>Tape No. 9 — cast v2</title>
<link rel="stylesheet" href="fonts/fonts.css">
<style>html,body{margin:0;background:#efe9df;overflow:hidden}canvas{display:block}</style></head>
<body><canvas id="c" width="1920" height="1080"></canvas>
<script type="module">
import { draw, CAST } from './cast2.js';
const which = new URLSearchParams(location.search).get('sheet') || 'lineup';
for (const w of [400, 600, 700]) await document.fonts.load(`${w} 40px 'IBM Plex Sans Thai'`);
const x = document.getElementById('c').getContext('2d'), TH = "'IBM Plex Sans Thai'";
const txt = (t, X, Y, size, w = 700, col = '#2a2230', al = 'left') => { x.font = `${w} ${size}px ${TH}`; x.fillStyle = col; x.textAlign = al; x.fillText(t, X, Y); };
function bg(dark) {
  const g = x.createLinearGradient(0, 0, 0, 1080); g.addColorStop(0, dark ? '#20202c' : '#f4efe6'); g.addColorStop(1, dark ? '#14141c' : '#e6dfd2'); x.fillStyle = g; x.fillRect(0, 0, 1920, 1080);
  for (let i = 0; i < 3000; i++) { x.fillStyle = `rgba(${dark ? '255,255,255' : '90,70,50'},${Math.random() * .04})`; x.fillRect(Math.random() * 1920, Math.random() * 1080, 2, 2); }
}
function shadow(cx, gy, w) { x.fillStyle = 'rgba(40,30,50,.15)'; x.beginPath(); x.ellipse(cx, gy, w, 16, 0, 0, 7); x.fill(); }
function headAt(id, bx, by, size, expr) {   // a bust, head centred at (bx, by); size = head radius
  const C = CAST[id], H = size * C.heads * 2, feet = (C.heads * 2 - 1.05) * size;
  x.save(); x.translate(bx, by + feet); draw(x, id, { H, expr, bust: true }); x.restore();
}
function render() {
  if (which === 'lineup') {
    bg(true);
    txt('ม้วนที่ ๙', 960, 110, 80, 700, '#f2ece0', 'center'); txt('ตัวละคร', 960, 165, 36, 400, '#b9b2c4', 'center');
    const ids = ['tham', 'tonkhao', 'jit', 'somchai', 'on', 'onGhost'];
    ids.forEach((id, i) => {
      const cx = 190 + i * 308, gy = 960, C = CAST[id]; shadow(cx, gy, 95);
      x.save(); x.translate(cx, gy); draw(x, id, { H: 108 * C.heads, expr: id === 'tham' ? 'focus' : id === 'tonkhao' ? 'smile' : id === 'on' ? 'smile' : 'neutral' }); x.restore();
      txt(C.name, cx, 1025, 34, 700, id === 'tham' ? '#e8c46a' : '#f2ece0', 'center');
    });
    txt('พระเอก', 190, 1060, 24, 600, '#e8c46a', 'center');
    return;
  }
  const C = CAST[which], ghost = which === 'onGhost'; bg(ghost);
  const ink = ghost ? '#f2ece0' : '#2a2230', sub = ghost ? '#b9b2c4' : '#5a5060';
  // full body
  shadow(330, 1010, 120); x.save(); x.translate(330, 1010); draw(x, which, { H: 128 * C.heads, expr: 'neutral' }); x.restore();
  // big portrait
  x.save(); x.beginPath(); x.roundRect(640, 70, 560, 620, 24); x.fillStyle = ghost ? '#2a2a38' : '#fbf8f2'; x.fill(); x.lineWidth = 4; x.strokeStyle = ink; x.stroke(); x.clip();
  headAt(which, 920, 380, 165, which === 'tham' ? 'focus' : ghost ? 'neutral' : 'smile'); x.restore();
  // expressions
  const ex = ghost ? [] : (which === 'tham' ? [['smirk', 'มั่นใจ'], ['scared', 'ตกใจ'], ['smile', 'ยิ้ม'], ['sad', 'กังวล']] : [['happy', 'ดีใจ'], ['scared', 'กลัว'], ['sad', 'เศร้า'], ['cry', 'ร้องไห้']]);
  ex.forEach(([e, t], i) => {
    const bx = 640 + i * 142, by = 720;
    x.save(); x.beginPath(); x.roundRect(bx, by, 130, 150, 14); x.fillStyle = '#fbf8f2'; x.fill(); x.lineWidth = 3; x.strokeStyle = ink; x.stroke(); x.clip(); headAt(which, bx + 65, by + 70, 44, e); x.restore();
    txt(t, bx + 65, by + 182, 24, 600, ink, 'center');
  });
  // text
  txt(C.name, 1260, 150, 84, 700, ink); txt(C.en, 1265, 200, 26, 600, sub);
  txt(C.role, 1260, 260, 30, 600, ghost ? '#e0a090' : '#a8392c');
  C.traits.forEach((t, i) => { txt('•', 1262, 340 + i * 58, 30, 700, ink); txt(t, 1295, 340 + i * 58, 28, 400, ink); });
  txt('ชุดสี', 1260, 840, 26, 600, sub);
  C.pal.forEach((c, i) => { x.fillStyle = c; x.beginPath(); x.roundRect(1260 + i * 100, 860, 86, 86, 12); x.fill(); x.lineWidth = 3; x.strokeStyle = ink; x.stroke(); });
}
window.render = () => render(); window.DUR = 1; render(); window.READY = true;
</script></body></html>
